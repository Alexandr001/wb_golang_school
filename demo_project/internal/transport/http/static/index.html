<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Заказы — поиск по ID</title>
    <link rel="icon" href="data:,">
    <link rel="stylesheet" href="style.css">
</head>
<body>
<main class="page">
    <header class="page__header">
        <h1>Поиск заказа</h1>
        <p class="hint">Введите <code>order_uid</code> — сервис отдаст заказ из кэша, а при промахе поднимет его из базы.</p>
    </header>

    <form class="search" id="search-form" autocomplete="off">
        <input class="search__input"
               id="order-uid"
               name="order_uid"
               type="text"
               maxlength="64"
               placeholder="b563feb7b2b84b6test"
               aria-label="Идентификатор заказа"
               required>
        <button class="search__button" id="search-button" type="submit">Найти</button>
        <button class="search__sample" id="sample-button" type="button">Тестовый ID</button>
    </form>

    <p class="status" id="status" role="status" hidden></p>

    <section class="result" id="result" hidden>
        <div class="meta" id="meta"></div>

        <article class="card">
            <h2>Заказ</h2>
            <dl class="fields" id="order-fields"></dl>
        </article>

        <article class="card">
            <h2>Доставка</h2>
            <dl class="fields" id="delivery-fields"></dl>
        </article>

        <article class="card">
            <h2>Оплата</h2>
            <dl class="fields" id="payment-fields"></dl>
        </article>

        <article class="card">
            <h2>Товары <span class="card__count" id="items-count"></span></h2>
            <div class="table-scroll">
                <table class="items">
                    <thead>
                    <tr>
                        <th>Название</th>
                        <th>Бренд</th>
                        <th>Размер</th>
                        <th class="num">Цена</th>
                        <th class="num">Скидка</th>
                        <th class="num">Итого</th>
                        <th class="num">chrt_id</th>
                        <th class="num">nm_id</th>
                        <th class="num">Статус</th>
                    </tr>
                    </thead>
                    <tbody id="items-body"></tbody>
                </table>
            </div>
        </article>
    </section>
</main>

<script src="app.js"></script>
</body>
</html>
